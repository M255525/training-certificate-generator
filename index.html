<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>訓練證書產生器</title>
<meta name="description" content="辦訓單位用的課程訓練證書產生器：填單位與課程、貼上學員名單，依出席率與成績自動判斷發證資格、編證書字號，一人一頁 A4 證書列印或存 PDF，附核發清冊與 QR 驗證碼。">
<meta name="theme-color" content="#1D2B3A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@600;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#1D2B3A; --desk-2:#24364A; --paper:#FFFFFF; --cream:#F6F2E8; --ink:#1F2630; --sub:#5F6875; --line:#DCD5C6;
  --gold:#C9A227; --gold-d:#8F7114; --red:#B3261E; --blue:#2F6FA8; --good:#2E7D4F; --bad:#B3261E;
  --mq:0px; color-scheme:light;
  --kai:'DFKai-SB','BiauKai','標楷體','LXGW WenKai TC','Kaiti TC','Noto Serif TC',serif;
  --ming:'Noto Serif TC','PMingLiU','新細明體',serif;
  --hei:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-fs="xl"]{font-size:19px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font-family:var(--hei);font-weight:500;line-height:1.55;padding-top:var(--mq);
  background-image:radial-gradient(circle at 20% 0,rgba(201,162,39,.10),transparent 40%),linear-gradient(135deg,rgba(255,255,255,.025) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.025) 50%,rgba(255,255,255,.025) 75%,transparent 75%);background-size:auto,14px 14px}
body.has-marquee{--mq:34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);font-weight:700}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{line-height:1.3;margin:0;font-weight:900}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:#101A24;z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:15px;font-weight:700;color:#F3DE9A;animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:100rem;margin:0 auto;padding:.8rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.top h1{flex:1 1 14rem;font-size:1.5rem;color:#fff;display:flex;align-items:center;gap:.5rem;white-space:nowrap;font-family:var(--ming)}
.top h1 .sealmini{width:2rem;height:2rem;border:3px solid #E0483E;color:#E0483E;border-radius:.3rem;font-family:var(--kai);font-size:.8rem;line-height:1;display:inline-grid;grid-template-columns:1fr 1fr;place-items:center;padding:.1rem;transform:rotate(-4deg)}
.top h1 small{font-size:.75rem;color:#C9D3DE;font-weight:700;font-family:var(--hei)}
@media (max-width:560px){.top h1{font-size:1.2rem;flex-basis:100%}.top h1 small{display:none}}
.ibtn{min-height:2.6rem;padding:0 .8rem;border:1px solid rgba(255,255,255,.28);border-radius:.6rem;background:rgba(255,255,255,.07);font-weight:700;font-size:.9rem;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:.3rem}
.ibtn:hover{background:rgba(255,255,255,.15)}
.lictop{border-color:rgba(201,162,39,.7);background:rgba(201,162,39,.16);color:#F3DE9A}
.lictop b{color:#fff;margin-left:.15rem}
.lictop small{font-size:.75rem;color:#E4D6A6;margin-left:.1rem}
.lictop.soon{border-color:#E0483E;background:rgba(224,72,62,.2);color:#FFD2CC}
@media (max-width:560px){.lictop small{display:none}}
.warn-line{margin:.35rem 0 0;font-size:.8rem;color:#C9D3DE}
.warn-line button{background:none;border:0;padding:0;color:#F3DE9A;font-weight:700;text-decoration:underline;font-size:inherit}

.work{display:grid;grid-template-columns:minmax(0,29rem) minmax(0,1fr);gap:1rem;margin-top:.9rem;align-items:start}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;min-width:0}
.card{min-width:0}
.pv{min-width:0;position:sticky;top:calc(var(--mq) + .5rem)}
.card{background:var(--paper);border-radius:.55rem;box-shadow:0 2px 0 rgba(0,0,0,.2),0 10px 22px rgba(0,0,0,.22);position:relative}
.card>summary{list-style:none;cursor:pointer;display:flex;gap:.55rem;align-items:center;padding:.75rem 1rem;font-weight:900;font-size:1.08rem}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:'▸';margin-left:auto;color:var(--sub);transition:transform .2s}
.card[open]>summary::after{transform:rotate(90deg)}
.card>summary .sv{font-weight:500;font-size:.78rem;color:var(--sub);margin-left:auto;text-align:right;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card>summary .sv+*{margin-left:0}
.no{width:1.75rem;height:1.75rem;border:2.5px solid var(--red);color:var(--red);border-radius:.25rem;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;flex:none;font-family:var(--kai);transform:rotate(-3deg)}
.cb{padding:0 1rem 1rem}
.small{font-size:.82rem;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-height:2.6rem;border:0;border-radius:.5rem;background:var(--desk);color:#fff;font-weight:900;padding:.25rem 1rem;text-decoration:none;box-shadow:0 3px 0 #0E1620}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0E1620}
.btn.gd{background:var(--gold);color:#241B00;box-shadow:0 3px 0 var(--gold-d)}
.btn.alt{background:var(--cream);color:var(--ink);box-shadow:0 0 0 1.5px var(--line),0 3px 0 var(--line)}
.btn.red{background:var(--red);box-shadow:0 3px 0 #6F1610}
.btn.big{font-size:1.12rem;min-height:3.1rem;padding:.25rem 1.4rem}
.btn.sm{min-height:2.1rem;padding:.1rem .65rem;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.go{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.fld{display:block;font-weight:700;font-size:.86rem;margin-top:.5rem}
.fld input,.fld select,.fld textarea{display:block;width:100%;min-height:2.45rem;margin-top:.15rem;padding:.2rem .55rem;border:1.5px solid var(--line);border-radius:.45rem;background:#fff;font-weight:500}
.fld textarea{padding:.45rem .55rem;line-height:1.5;resize:vertical;font-size:.88rem;background:#FFFDF8}
.fld .hint{display:block;font-weight:500;font-size:.76rem;color:var(--sub)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:0 .7rem}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:0 .6rem}
.chk{display:flex;gap:.5rem;align-items:center;margin-top:.45rem;font-weight:700;font-size:.9rem}
.chk input{width:1.2rem;height:1.2rem;accent-color:var(--desk);flex:none}
.alert{border-radius:.5rem;padding:.45rem .7rem;margin-top:.6rem;font-weight:700;font-size:.86rem}
.alert.ok{background:#DCF0E3;color:#14502E}.alert.warn{background:#FFF0CC;color:#6B4300}.alert.bad{background:#FADBD8;color:#7A1A14}
.exs{display:flex;flex-wrap:wrap;gap:.4rem}
.ex{border:0;border-radius:.5rem;background:rgba(255,255,255,.08);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25);padding:.35rem .6rem;text-align:left;line-height:1.25}
.ex b{display:block;font-size:.88rem}.ex small{font-size:.72rem;color:#C9D3DE}
.ex:hover{background:rgba(255,255,255,.15)}
.tokens{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem}
.tokens button{border:0;background:#EEF2F6;border-radius:2rem;padding:.05rem .5rem;font-size:.76rem;font-weight:700;color:#33475B}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin-top:.5rem}
.imgbox{border:1.5px dashed var(--line);border-radius:.5rem;padding:.4rem;text-align:center;font-size:.78rem;font-weight:700;background:#FCFBF8;min-height:6.2rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.25rem}
.imgbox img{max-width:100%;max-height:3rem;object-fit:contain}
.imgbox .ph{color:#B0A898;font-size:1.6rem;line-height:1}
.imgbox label{cursor:pointer;color:var(--blue)}
.imgbox button{border:0;background:none;color:var(--bad);font-size:.74rem;font-weight:700;padding:0}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:.4rem;margin-top:.5rem}
.sty{border:0;border-radius:.5rem;background:var(--cream);box-shadow:0 0 0 1.5px var(--line);padding:.35rem;text-align:left;line-height:1.2}
.sty .sw{display:block;height:2.6rem;border-radius:.3rem;margin-bottom:.3rem;background:#fff;position:relative;overflow:hidden}
.sty b{font-size:.86rem;display:block}.sty small{font-size:.7rem;color:var(--sub)}
.sty[aria-pressed="true"]{background:#FFF5D6;box-shadow:0 0 0 2.5px var(--gold)}
.tw{overflow-x:auto;margin-top:.5rem;border:1px solid var(--line);border-radius:.5rem;max-height:22rem;overflow-y:auto}
table.rs{border-collapse:collapse;width:100%;font-size:.8rem;min-width:28rem}
.rs th,.rs td{border-bottom:1px solid #EEE8DC;padding:.25rem .35rem;text-align:left;vertical-align:top}
.rs th{background:#F7F4EC;position:sticky;top:0;z-index:1;font-size:.76rem}
.rs td.st{font-size:.74rem}
.rs .ok{color:var(--good);font-weight:900}.rs .ng{color:var(--bad);font-weight:700}
.rs tr.off td{opacity:.45}
.rs input{width:1.05rem;height:1.05rem;accent-color:var(--desk)}
.idb{font-size:.72rem;font-weight:900;padding:0 .25rem;border-radius:.25rem}
.idb.bad{background:#FADBD8;color:#7A1A14}.idb.other{background:#EEF2F6;color:#33475B}
.stat{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.stat span{background:var(--cream);border-radius:2rem;padding:.05rem .6rem;font-size:.78rem;font-weight:700;box-shadow:0 0 0 1px var(--line)}
.stat span.g{background:#DCF0E3}.stat span.r{background:#FADBD8}

/* 預覽 */
.pvbar{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;background:rgba(0,0,0,.28);border-radius:.6rem;padding:.45rem .6rem;color:#fff}
.pvbar .sp{flex:1 1 auto}
.pvbar input[type=range]{width:7rem;accent-color:var(--gold)}
.vt{display:flex;gap:.2rem}
.vt button{border:0;border-radius:.4rem;padding:.3rem .65rem;background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:.86rem}
.vt button[aria-selected="true"]{background:var(--gold);color:#241B00}
#sheetsWrap{margin-top:.6rem;max-height:calc(100vh - var(--mq) - 7rem);overflow:auto;border-radius:.6rem;background:rgba(0,0,0,.2);padding:.8rem}
@media (max-width:1000px){.pv{position:static}#sheetsWrap{max-height:none}}
#sheets{zoom:var(--z,.45);width:max-content;margin:0 auto}
.empty-pv{color:#C9D3DE;text-align:center;padding:3rem 1rem;font-weight:700}

/* ===== A4 頁面 ===== */
.sheet{background:#fff;margin:0 auto 8mm;box-shadow:0 4px 14px rgba(0,0,0,.4);position:relative;overflow:hidden;color:#1F2630}
.sheet.land{width:297mm;height:210mm}
.sheet.port{width:210mm;height:297mm}
.frame,.wm{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cert{background:var(--pp,#fff);color:var(--tx,#222);font-family:var(--cf)}
.cert.f-kai{--cf:var(--kai)}.cert.f-ming{--cf:var(--ming)}.cert.f-hei{--cf:var(--hei)}
.cert .cno{position:absolute;font-size:3.6mm;letter-spacing:.05em;color:var(--tx)}
.cert .cin{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .logo{height:15mm;margin-bottom:2mm;display:flex;align-items:center;gap:3mm;font-size:4.2mm;font-weight:700;color:var(--c1)}
.cert .logo img{max-height:15mm;max-width:60mm;object-fit:contain}
.cert .ttl{font-weight:700;color:var(--c1);letter-spacing:.42em;padding-left:.42em;line-height:1.1}
.cert .ettl{font-family:'Noto Serif TC',Georgia,serif;font-style:italic;color:var(--c2);letter-spacing:.12em;margin-top:1.5mm}
.cert .nm{font-weight:700;margin-top:6mm;line-height:1.2;border-bottom:.35mm solid var(--c2);padding:0 6mm 1.2mm;letter-spacing:.18em}
.cert .nm small{font-size:.5em;letter-spacing:0;margin-left:1.5mm;font-weight:400}
.cert .ennm{font-family:Georgia,'Times New Roman',serif;font-size:4.2mm;letter-spacing:.06em;margin-top:1mm;color:var(--c2)}
.cert .idl{font-size:3.7mm;margin-top:2mm;letter-spacing:.04em}
.cert .txt{margin:5mm 0 0;text-align:justify;text-indent:2em;line-height:1.95;letter-spacing:.05em}
.cert .txt b{font-weight:700}
.cert .en{margin:2.5mm 0 0;font-family:Georgia,'Times New Roman',serif;font-size:3.6mm;line-height:1.55;text-align:center;color:#444;font-style:italic}
.cert table.subj{border-collapse:collapse;margin:4mm auto 0;font-size:3.3mm;font-family:var(--hei)}
.cert table.subj th,.cert table.subj td{border:.25mm solid var(--c2);padding:.6mm 2.5mm}
.cert table.subj th{background:rgba(0,0,0,.04)}
.cert .sign{position:absolute;display:flex;align-items:flex-end;gap:4mm}
.cert .sign .who{text-align:left;font-size:5.4mm;line-height:1.75;letter-spacing:.08em;position:relative;z-index:2}
.cert .sign .who .u{font-weight:700;font-size:6mm}
.cert .sign .who .addr{font-size:3.2mm;letter-spacing:0;color:#555;line-height:1.4;font-family:var(--hei)}
.cert .sign .sg{display:inline-block;height:12mm;vertical-align:middle;margin-left:2mm}
.cert .seal{position:absolute;z-index:3;mix-blend-mode:multiply;opacity:.92}
.cert .seal img{width:100%;height:100%;object-fit:contain}
.cert .seal.blank{border:.35mm dashed #C9B9B5;mix-blend-mode:normal;display:flex;align-items:center;justify-content:center;font-size:3mm;color:#B9A7A2;font-family:var(--hei)}
.cert .qr{position:absolute;display:flex;flex-direction:column;align-items:center;font-family:var(--hei);font-size:2.5mm;color:#555;line-height:1.3;text-align:center}
.cert .qr .qi{width:25mm;height:25mm;background:#fff;padding:1mm}
.cert .qr .qi img,.cert .qr .qi canvas{width:100%!important;height:100%!important;display:block}
.cert .qr b{font-size:3mm;letter-spacing:.06em;color:#222}
.cert .dt{position:absolute;display:flex;justify-content:space-between;font-size:5.6mm;letter-spacing:.1em}
.cert .dt span{white-space:nowrap}
.cert.port .nm{margin-top:14mm}.cert.port .txt{margin-top:10mm;line-height:2.1}.cert.port .ttl{margin-top:4mm}.cert.port .en{margin-top:5mm}
.cert .tag{position:absolute;top:3mm;right:4mm;font:700 3mm var(--hei);color:#fff;background:#B3261E;padding:.5mm 2mm;border-radius:1mm}

/* 背面科目表 */
.backp{background:var(--pp,#fff);font-family:var(--cf)}
.backp .bin{position:absolute;inset:22mm 26mm}
.backp h3{font-size:7mm;text-align:center;letter-spacing:.3em;color:var(--c1)}
.backp .meta{text-align:center;font-size:3.8mm;margin:2mm 0 5mm;color:#444}
.backp table{border-collapse:collapse;width:100%;font-size:4mm;font-family:var(--hei)}
.backp th,.backp td{border:.3mm solid #666;padding:1.6mm 3mm;text-align:left}
.backp th{background:#F2EFE6}
.backp td.h{text-align:right;width:22mm}

/* 清冊 */
.reg{font-family:var(--hei);font-size:3.4mm}
.reg .rin{position:absolute;inset:14mm 12mm}
.reg h2{text-align:center;font-size:6.2mm;letter-spacing:.2em}
.reg .meta{display:grid;grid-template-columns:1fr 1fr;gap:.6mm 6mm;margin:3mm 0 2mm;font-size:3.3mm}
.reg table{border-collapse:collapse;width:100%}
.reg th,.reg td{border:.3mm solid #444;padding:1.2mm 1.5mm;height:9.6mm;text-align:center}
.reg th{background:#F2EFE6;height:auto}
.reg td.l{text-align:left}
.reg .ft{display:flex;justify-content:space-between;margin-top:6mm;font-size:3.6mm}
.reg .pg{position:absolute;bottom:6mm;left:0;right:0;text-align:center;font-size:2.8mm;color:#888}

.foot{text-align:center;font-size:.82rem;color:#C9D3DE;margin-top:2rem}
.foot a{margin:0 .4rem;color:#F3DE9A}
#modal{position:fixed;inset:0;background:rgba(10,18,28,.68);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{background:#fff;width:100%;max-width:42rem;max-height:calc(100dvh - 2rem);overflow:auto;border-radius:.8rem;padding:1rem 1.1rem}
#modalBox h2{font-size:1.3rem;margin-bottom:.4rem}
#modalBox ul,#modalBox ol{margin:.3rem 0;padding-left:1.2em}
.stack{display:grid;gap:.45rem;margin-top:.6rem}
.set-sec{border-radius:.55rem;margin-bottom:.45rem;background:var(--cream);box-shadow:0 0 0 1px var(--line)}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;font-weight:700;min-height:2.9rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';flex:none;transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0;min-width:0}
.set-sec .ssv{font-weight:500;font-size:.78rem;color:var(--sub);text-align:right}
.set-body{padding:0 .75rem .75rem}
.vcard{border:2px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;margin-top:.5rem;background:#FFFDF8}
.vcard dl{display:grid;grid-template-columns:6.5em 1fr;gap:.2rem .6rem;margin:0}
.vcard dt{color:var(--sub);font-weight:700}
.vcard dd{margin:0;font-weight:700;word-break:break-all}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#101A24;color:#fff;padding:.55rem 1rem;border-radius:.6rem;z-index:90;font-weight:700;max-width:calc(100vw - 2rem)}

/* 登入序號閘門 */
#entryGate{position:fixed;inset:0;background:var(--desk);z-index:3200;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;
  background-image:radial-gradient(circle at 20% 0,rgba(201,162,39,.16),transparent 45%)}
#entryGate.hidden{display:none}
body.verify-only #app{display:none} /* 沒登入的人掃 QR：只看得到查驗畫面 */
body:has(#entryGate:not(.hidden)){overflow:hidden}
.gate-box{background:#FBF6E7;color:var(--ink);border:3px solid var(--gold);box-shadow:0 0 0 6px #FBF6E7,0 0 0 7.5px var(--gold),0 18px 40px rgba(0,0,0,.4);border-radius:.4rem;padding:1.4rem 1.2rem 1.1rem;width:470px;max-width:calc(100% - 16px);text-align:center;margin:auto}
.gate-box .gseal{width:3.2rem;height:3.2rem;margin:0 auto .5rem;border:4px solid var(--red);color:var(--red);border-radius:.3rem;font-family:var(--kai);font-size:1.15rem;line-height:1;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:.15rem;transform:rotate(-4deg)}
.gate-box h2{font-size:1.45rem;font-family:var(--ming);margin-bottom:.3rem}
.gate-desc{font-size:.9rem;color:var(--sub);margin:.3rem 0 .7rem}
.gate-row{display:flex;gap:.35rem;margin:.5rem 0}
#entryGateSerial{flex:1 1 0;min-width:0;min-height:3rem;font-weight:700;text-align:center;padding:.3rem .5rem;border:2px solid var(--line);border-radius:.5rem;background:#fff;color:#111;letter-spacing:.06em}
#btnEntryGateToggle{flex:none;font-size:.8rem;padding:0 .6rem}
#btnEntryGateConfirm{width:100%}
.gate-foot{font-size:.76rem;color:var(--sub);margin:.8rem 0 0}
.gate-free{margin-top:.9rem;padding:.7rem .75rem;border:2px dashed var(--gold);border-radius:.5rem;background:#FFF8DF;text-align:center}
.gate-free .gf-t{font-weight:900;font-size:.95rem}
.gate-free .gf-code{display:inline-block;margin:.35rem 0;font:900 1.25rem/1.2 ui-monospace,Consolas,'Courier New',monospace;letter-spacing:.08em;background:#fff;border:1.5px solid var(--line);border-radius:.4rem;padding:.25rem .7rem;user-select:all;color:#111}
.gate-free .gf-n{font-size:.76rem;color:var(--sub);margin:.3rem 0 0}
.gate-free .go{justify-content:center;margin-top:.35rem}
.lic{display:inline-block;font-size:.8rem;font-weight:700;padding:.2rem .6rem;border-radius:.5rem;border:2px solid var(--line);margin-top:.55rem;overflow-wrap:anywhere}
.lic.ok{color:#14632F;border-color:#14632F;background:#E6F4E9}
.lic.bad{color:#A32019;border-color:#A32019;background:#FBE9E7}
#entryGateHeadcount:empty,#headcountBadge:empty{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#marqueeTrack{animation:marquee-scroll 90s linear infinite!important}}
@page{size:A4 portrait;margin:0}
@page land{size:A4 landscape;margin:0}
@page port{size:A4 portrait;margin:0}
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0}
  body{background-image:none!important}
  #marqueeBar,#entryGate,.noprint,.toast,#modal,.top,.warn-line,.foot,.panel,.pvbar,.exs{display:none!important}
  #app{max-width:none;padding:0;margin:0}
  .work{display:block;margin:0}
  .pv{position:static}
  #sheetsWrap{max-height:none;overflow:visible;padding:0;background:none;margin:0;border-radius:0}
  #sheets{zoom:1!important;width:auto}
  .sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .sheet.land{page:land}.sheet.port{page:port}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cert .tag{display:none}
}
</style>
</head>
<body>
<div id="entryGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-box">
    <div class="gseal" aria-hidden="true"><span>證</span><span>訓</span><span>書</span><span>結</span></div>
    <h2 id="gateTitle">訓練證書產生器</h2>
    <p class="gate-desc">請輸入登入序號，再按「確認」。這台電腦會記住，之後不用再輸入。登入後畫面上方會顯示序號的到期日。</p>
    <div class="gate-row">
      <input type="password" id="entryGateSerial" placeholder="請輸入登入序號" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="登入序號">
      <button class="btn alt" type="button" id="btnEntryGateToggle" aria-pressed="false" aria-label="顯示序號">👁 顯示</button>
    </div>
    <button class="btn gd big" type="button" id="btnEntryGateConfirm">確認</button>
    <span id="entryGateStatus" class="lic" role="status">尚未驗證</span>
    <div><span id="entryGateHeadcount" class="lic" aria-live="polite"></span></div>
    <div class="gate-free" id="gateFree">
      <div class="gf-t">🎁 免費試用序號</div>
      <div class="gf-code" id="gateFreeCode"></div>
      <div class="go"><button class="btn sm" type="button" id="btnGateFree">用免費序號登入</button><button class="btn alt sm" type="button" id="btnGateFreeCopy">複製序號</button></div>
      <p class="gf-n">登入後畫面上方會顯示到期日。免費序號同時使用的人數有上限，額滿時請稍後再試。</p>
    </div>
    <p class="gate-foot">沒有序號？請洽 tsaimark@gmail.com｜<a href="manual.html" target="_blank" rel="noopener">📖 操作手冊</a><br>拿到證書要查驗的人不需要序號，直接掃證書上的 QR code。</p>
  </div>
</div>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>
<noscript>這個工具需要開啟 JavaScript。</noscript>
<script src="data.js"></script>
<script src="io.js"></script>
<script src="course-link.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
